<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypeScript Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#f3f6fd;--ink:#0f1b3d;--mute:#5d6b8f;--line:#dfe6f5;--blue:#2563eb;--vio:#6d5dfc;--teal:#0ea5a4;--amber:#f59e0b;--grad:linear-gradient(135deg,#2563eb,#6d5dfc);--sans:'Bricolage Grotesque',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--shadow:0 8px 28px #1d3a8a14}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.65}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
aside{width:272px;flex:none;background:linear-gradient(180deg,#14214f,#1b3a96);color:#fff;padding:26px 20px;display:flex;flex-direction:column;gap:28px;overflow:auto}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:11px;background:#fff;color:var(--blue);display:grid;place-items:end;padding:5px 7px;font:800 18px/1 var(--mono)}
.brand b{font-size:19px;font-weight:800;display:block;line-height:1.2}
.brand span{font-size:13px;color:#b9c9f5}
aside h3{font-size:13px;font-weight:700;color:#b9c9f5;margin-bottom:10px}
.seg{display:flex;background:#ffffff1f;border-radius:10px;padding:3px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:7px 2px;font-size:13px;color:#dbe6ff;cursor:pointer;transition:.15s}
.seg button.on{background:#fff;color:var(--blue);font-weight:700}
.topics{display:flex;flex-direction:column;gap:2px}
.topics button{background:none;border:0;border-radius:8px;text-align:left;padding:8px 12px;color:#e8eeff;cursor:pointer;font-size:15px;transition:.15s}
.topics button:hover{background:#ffffff1f;padding-left:16px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 32px;background:#fff;border-bottom:1px solid var(--line)}
header strong{font-weight:800;font-size:18px}
header span.sub{color:var(--mute);font-size:14px;margin-left:10px}
.tools{display:flex;gap:8px}
.tools button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
.tools button:hover{border-color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.dot.on{background:#22c55e;box-shadow:0 0 0 4px #22c55e26}.dot.wait{background:var(--amber)}.dot.off{background:#ef4444}
#feed{flex:1;overflow-y:auto;padding:28px 32px;scroll-behavior:smooth}
.wrap{max-width:800px;margin:0 auto}
.hero{padding:4vh 0 0}
.hero h1{font-size:clamp(34px,5vw,52px);font-weight:800;line-height:1.05;letter-spacing:-.03em;max-width:13ch}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);margin:14px 0 28px;max-width:48ch}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cards button{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:16px 18px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:.18s}
.cards button:hover{transform:translateY(-3px);box-shadow:0 14px 34px #1d3a8a24}
.cards b{display:block;font-size:16px;margin-bottom:2px}
.cards span{font-size:14px;color:var(--mute)}
.msg{display:flex;gap:12px;margin-bottom:24px}
.msg.user{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:end;padding:4px 5px;font:800 12px/1 var(--mono);color:#fff;margin-top:2px}
.bubble{min-width:0}
.user .bubble{background:var(--grad);color:#fff;padding:11px 18px;border-radius:18px 18px 4px 18px;max-width:80%;white-space:pre-wrap;box-shadow:0 8px 22px #4f46e540}
.bot .bubble{flex:1;background:#fff;border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:18px 22px;box-shadow:var(--shadow)}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin:0}
.bubble ul,.bubble ol{margin:0 0 10px 20px}.bubble li{margin-bottom:4px}.bubble li::marker{color:var(--vio)}
.bubble strong{color:#14214f}
.bubble blockquote{background:#eef4ff;border-left:4px solid var(--blue);border-radius:4px 10px 10px 4px;padding:10px 16px;margin:0 0 14px}
.bubble h3{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin:18px 0 8px}
.bubble h3::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--grad)}
.bubble code{font:13.5px var(--mono);background:#eef1fb;color:#4338ca;padding:2px 6px;border-radius:5px}
.bubble pre{position:relative;margin:6px 0 12px;border-radius:12px;overflow-x:auto;background:#0f172a}
.bubble pre code{background:none;color:inherit;padding:18px;display:block;font-size:13.5px;line-height:1.65}
.bubble table{border-collapse:collapse;margin:6px 0 12px;font-size:14.5px;display:block;overflow-x:auto}
.bubble th,.bubble td{border:1px solid var(--line);padding:7px 12px;text-align:left}.bubble th{background:#eef4ff}
.copy{position:absolute;top:8px;right:8px;background:#ffffff1a;border:0;border-radius:6px;padding:2px 10px;font-size:12px;color:#cbd5e1;cursor:pointer}
.copy:hover{background:#ffffff33;color:#fff}
.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--vio);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.composer{padding:0 32px 22px}
.box{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 20px;box-shadow:var(--shadow);transition:border-color .15s}
.box:focus-within{border-color:var(--vio)}
textarea{flex:1;background:none;border:0;resize:none;outline:0;max-height:180px;padding:6px 0;line-height:1.5}
textarea::placeholder{color:#8b98b8}
#send{background:var(--grad);border:0;border-radius:12px;width:42px;height:42px;cursor:pointer;display:grid;place-items:center;transition:.15s}
#send:hover{filter:brightness(1.1)}#send:disabled{opacity:.4;cursor:default}
dialog{margin:auto;border:0;border-radius:18px;padding:26px;width:min(440px,92vw);box-shadow:0 30px 80px #0f1b3d55;color:var(--ink)}
dialog::backdrop{background:#0f1b3d88;backdrop-filter:blur(3px)}
dialog h2{font-size:20px;margin-bottom:6px}dialog p{color:var(--mute);font-size:14.5px;margin-bottom:16px}
dialog input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px var(--mono);margin-bottom:14px}
.row{display:flex;gap:10px;justify-content:flex-end}
.row button{border-radius:10px;padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:#fff}
.row .pri{background:var(--grad);color:#fff;border:0;font-weight:700}
@media(max-width:860px){body{flex-direction:column}aside{width:100%;flex-direction:row;align-items:center;padding:12px 16px;gap:16px}aside section:nth-of-type(2),.brand span{display:none}aside section:first-of-type{flex:1}.brand b{font-size:16px}main{height:calc(100vh - 66px)}#feed,.composer,header{padding-left:16px;padding-right:16px}.cards{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">TS</div><div><b>TypeScript Tutor</b><span>Learn by asking</span></div></div>
  <section>
    <h3>Your level</h3>
    <div class="seg" id="levels"><button class="on">Beginner</button><button>Intermediate</button><button>Advanced</button></div>
  </section>
  <section>
    <h3>Topics</h3>
    <div class="topics">
      <button data-q="Teach me the basic types in TypeScript">Basic types</button>
      <button data-q="Teach me interfaces and type aliases in TypeScript">Interfaces and type aliases</button>
      <button data-q="Teach me generics in TypeScript">Generics</button>
      <button data-q="Explain TypeScript utility types like Partial, Pick, Omit and Record">Utility types</button>
      <button data-q="Explain narrowing and type guards in TypeScript">Narrowing and guards</button>
      <button data-q="Teach me classes and access modifiers in TypeScript">Classes</button>
      <button data-q="Explain modules and tsconfig.json options in TypeScript">Modules and tsconfig</button>
      <button data-q="How do I type async functions and Promises in TypeScript?">Async and Promises</button>
      <button data-q="How do I use TypeScript with React components and hooks?">React with TypeScript</button>
    </div>
  </section>
</aside>

<main>
  <header>
    <div><strong>Chat</strong><span class="sub">TypeScript questions only</span></div>
    <div class="tools"><button id="pill"><i class="dot" id="dot"></i><span id="stxt">Not connected</span></button><button id="clear">New chat</button></div>
  </header>
  <div id="feed"><div class="wrap" id="log"></div></div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Ask anything about TypeScript" aria-label="Message"></textarea>
      <button id="send" aria-label="Send message"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</main>

<dialog id="dlg">
  <h2>Connect your tutor</h2>
  <p>Run the Colab notebook, then paste the public link it prints.</p>
  <input id="url" placeholder="https://xxxx.gradio.live" aria-label="Public link">
  <div class="row"><button id="cancel">Close</button><button class="pri" id="connect">Connect</button></div>
</dialog>

<template id="heroT">
  <div class="hero" id="hero">
    <h1>Learn <em>TypeScript</em> the easy way</h1>
    <p>Clear answers with examples, common mistakes and a small exercise every time.</p>
    <div class="cards">
      <button data-q="Explain generics with a simple example" style="--c:#2563eb"><b>Generics</b><span>Reusable code that stays type-safe</span></button>
      <button data-q="Interface vs type: when should I use which?" style="--c:#6d5dfc"><b>Interface vs type</b><span>Pick the right one with confidence</span></button>
      <button data-q="Why do I get 'Type string is not assignable to type number' and how do I fix it?" style="--c:#0ea5a4"><b>Fix a type error</b><span>Understand what the compiler means</span></button>
      <button data-q="Set up a strict tsconfig.json for a Node project" style="--c:#f59e0b"><b>Project setup</b><span>A solid tsconfig to start with</span></button>
    </div>
  </div>
</template>

<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const $ = s => document.querySelector(s);
const log = $("#log"), feed = $("#feed"), input = $("#input"), dlg = $("#dlg");
let app = null, history = [], level = "Beginner", busy = false;

const showHero = () => { log.innerHTML = ""; log.append($("#heroT").content.cloneNode(true)); };
showHero();
const setStatus = (t, c) => { $("#stxt").textContent = t; $("#dot").className = "dot " + c; };

let saved = new URLSearchParams(location.search).get("url") || "";
try { saved = saved || localStorage.getItem("ts_url") || ""; } catch {}
$("#url").value = saved;

async function connect() {
  const u = $("#url").value.trim();
  if (!u) { setStatus("Not connected", "off"); return false; }
  setStatus("Connecting", "wait");
  try {
    app = await Client.connect(u);
    try { localStorage.setItem("ts_url", u); } catch {}
    setStatus("Connected", "on"); dlg.close(); return true;
  } catch { app = null; setStatus("Offline", "off"); return false; }
}

function render(el, md) {
  if (!md) { el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; return; }
  el.innerHTML = DOMPurify.sanitize(marked.parse(md));
  el.querySelectorAll("pre").forEach(pre => {
    const code = pre.querySelector("code");
    if (code) hljs.highlightElement(code);
    pre.insertAdjacentHTML("afterbegin", '<button class="copy">Copy</button>');
  });
}

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = (role === "bot" ? '<div class="av">TS</div>' : "") + '<div class="bubble"></div>';
  const b = d.querySelector(".bubble");
  role === "user" ? (b.textContent = text) : render(b, text);
  log.append(d);
  feed.scrollTop = feed.scrollHeight;
  return b;
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  if (!app && !(await connect())) { dlg.showModal(); return; }
  busy = true; $("#send").disabled = true;
  $("#hero")?.remove();
  addMsg("user", text);
  const el = addMsg("bot", "");
  let out = "";
  try {
    const job = app.submit("/chat", [text, JSON.stringify(history.slice(-20)), level]);
    for await (const m of job) {
      if (m.type === "data") { out = m.data[0] || out; render(el, out); feed.scrollTop = feed.scrollHeight; }
      else if (m.type === "status" && m.stage === "error") throw new Error(m.message || "Server error");
    }
    history.push({ role: "user", content: text }, { role: "assistant", content: out });
  } catch (e) {
    render(el, "The tutor is not responding. Make sure the Colab notebook is still running, then try again.");
    setStatus("Offline", "off"); app = null;
  }
  busy = false; $("#send").disabled = false; input.focus();
}

$("#pill").onclick = () => dlg.showModal();
$("#cancel").onclick = () => dlg.close();
$("#connect").onclick = connect;
$("#send").onclick = () => { const t = input.value; input.value = ""; input.style.height = "auto"; send(t); };
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#send").click(); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
$("#clear").onclick = () => { if (!busy) { history = []; showHero(); } };
$("#levels").onclick = e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#levels button").forEach(b => b.classList.remove("on"));
  e.target.classList.add("on"); level = e.target.textContent;
};
document.addEventListener("click", e => {
  const q = e.target.closest("[data-q]");
  if (q) return send(q.dataset.q);
  if (e.target.classList.contains("copy")) {
    navigator.clipboard.writeText(e.target.parentElement.querySelector("code").innerText);
    e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy", 1400);
  }
});
if (saved) connect(); else dlg.showModal();
</script>
</body>
</html>
